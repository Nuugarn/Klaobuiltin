<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLAO — งานออกแบบสถาปัตยกรรมและตกแต่งภายใน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Mitr:wght@500;600;700&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

  :root {
    --plaster: #EDE8E0;
    --plaster-deep: #E2DCD1;
    --ink: #1C1A17;
    --teak: #8B7355;
    --pine: #3A4A3F;
    --line: #C9C2B5;
    --white: #FAF8F5;
    --gold: #C6A15B;
    --gold-dim: #8A7040;
    --header-height: 70px;
    --drawer-width: min(320px, 82vw);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; background: var(--plaster); }

  body {
    background: var(--plaster);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    line-height: 1.6;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--pine); color: var(--white); }

  :focus-visible {
    outline: 2px solid var(--pine);
    outline-offset: 3px;
  }

  .display {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 64px);
  }

  /* ---------- Header ----------
     Fixed, 70px, solid white box (does not overlay the hero).
     3-zone flexbox: hamburger + logo (left) | spacer (center) | contact (right) */
  .site-header {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: var(--header-height);
    z-index: 100;
    display: flex;
    align-items: center;
    padding: 0 24px;
    background: #FFFFFF;
    border-bottom: 1px solid var(--line);
    transition: box-shadow 0.25s ease, background 0.25s ease;
  }

  body.sticky-header .site-header {
    box-shadow: 0 2px 12px rgba(28, 26, 23, 0.08);
  }

  .header-zone--left {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .hamburger-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: var(--ink);
  }
  .hamburger-btn svg { width: 24px; height: 24px; display: block; }

  .header-zone--center {
    flex: 1 1 auto;
    position: relative;
    height: 100%;
  }

  .site-logo {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }

  .site-logo img {
    height: 34px;
    width: auto;
    display: block;
  }

  .header-zone--right {
    flex: 0 0 140px;
    width: 140px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 32px;
    height: 100%;
  }

  .contact-btn {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    background: none;
    border: none;
    cursor: pointer;
    transition: opacity 0.25s ease;
    white-space: nowrap;
  }
  .contact-btn:hover { opacity: 0.6; }

  .contact-icon-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--ink);
    border-radius: 50%;
    background: none;
    color: var(--ink);
    cursor: pointer;
  }
  .contact-icon-btn svg { width: 16px; height: 16px; }

  @media (max-width: 480px) {
    .contact-btn { display: none; }
    .contact-icon-btn { display: flex; }
  }

  /* ---------- Push drawer ----------
     page-shell holds everything (incl. the fixed header) and slides right
     when the drawer opens; a transformed ancestor re-anchors position:fixed
     children, so the header moves in sync automatically. */
  .page-shell {
    position: relative;
    background: var(--plaster);
    min-height: 100vh;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Dark translucent scrim over the pushed home content while the drawer
     is open. Sits inside page-shell so it moves in sync (fixed re-anchors
     to the transformed ancestor, same trick as the header). Tapping it
     closes the drawer, same as the X button. */
  .page-overlay {
    position: fixed;
    inset: 0;
    height: 100vh;
    -webkit-tap-highlight-color: transparent;
    background: rgba(28, 26, 23, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 200;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  body.menu-open .page-overlay {
    opacity: 1;
    pointer-events: auto;
  }

  body.menu-open .page-shell {
    transform: translateX(var(--drawer-width));
  }

  /* Freeze the home page's own scroll while the drawer is open */
  html.menu-open,
  body.menu-open {
    overflow: hidden;
    height: 100%;
  }

  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--drawer-width);
    height: 100vh;
    background: #FFFFFF;
    z-index: 300;
    transform: translateX(-100%);
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 20px 24px 24px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  body.menu-open .drawer {
    transform: translateX(0);
  }

  /* External close button: sits outside the drawer, hugging the left edge
     of the pushed home content. Both the white box and the icon fade in
     together (opacity only) rather than sliding, and it stays fixed to
     the viewport regardless of drawer state. */
  .drawer-external-close {
    position: fixed;
    top: 15px;
    left: calc(var(--drawer-width) + 24px);
    -webkit-tap-highlight-color: transparent;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    border: none;
    border-radius: 4px;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    z-index: 310;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease 0.15s;
  }

  body.menu-open .drawer-external-close {
    opacity: 1;
    pointer-events: auto;
  }

  .drawer-external-close svg { width: 20px; height: 20px; display: block; }

  /* Tab headers "เมนู" / "อื่นๆ" — each sits in its own full-bleed row
     with a bottom divider; the active tab gets a pill (oval) background
     hugging just the word itself. Both tabs sit side by side. */
  .drawer-tab-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 -24px;
    padding: 0 24px;
  }

  .drawer-tab {
    font-family: 'Kanit', 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(1.3rem, 4.5vw, 1.6rem);
    color: #1C1A17;
    background: none;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    padding: 8px 16px;
    margin: 4px 0;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .drawer-tab.active {
    background: #F2F2F2; /* matches reference: light neutral gray pill */
    color: var(--ink);
  }

  .drawer-links {
    list-style: none;
    display: flex;
    flex-direction: column;
    margin-top: 22px; /* gap under เมนู/อื่นๆ tabs */
    border-top: 1px solid var(--line); /* line sits just above first item */
  }

  .drawer-links[hidden] {
    display: none;
  }

  .drawer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 -24px;
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
  }

  .drawer-link {
    font-family: 'Mitr', sans-serif;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--ink);
    padding: 11px 0;
    display: inline-block;
    transition: color 0.25s ease;
  }

  a.drawer-link:hover {
    color: var(--teak);
    cursor: pointer;
  }

  .drawer-plus {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    position: relative;
  }
  .drawer-plus svg { width: 16px; height: 16px; display: block; }
  /* vertical line of + collapses → becomes − */
  .drawer-plus svg line:first-child {
    transform-origin: center;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .drawer-item.is-open > .drawer-row .drawer-plus svg line:first-child,
  .drawer-row.is-open .drawer-plus svg line:first-child {
    transform: scaleY(0);
    opacity: 0;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    margin-top: var(--header-height);
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--ink);
    overflow: hidden;
  }

  .hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1;
    animation: hero-in 1.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes hero-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ---------- Filter bar ---------- */
  .section-bleed-white {
    background: #FFFFFF;
  }

  .filter-section {
    padding: clamp(48px, 7vw, 80px) 0 clamp(24px, 4vw, 40px);
    border-bottom: 1px solid var(--line);
  }

  .filter-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
  }

  .filter-title {
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 400;
  }

  .filter-title .count {
    color: var(--teak);
  }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    padding: 9px 18px;
    border: 1px solid var(--line);
    border-radius: 100px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .filter-btn:hover {
    border-color: var(--ink);
  }

  .filter-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--white);
  }

  /* ---------- Gallery ---------- */
  .gallery {
    padding: clamp(32px, 5vw, 56px) 0 clamp(64px, 8vw, 120px);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(14px, 2vw, 24px);
  }

  .project {
    position: relative;
    overflow: hidden;
    background: var(--plaster-deep);
    cursor: pointer;
    grid-column: span 3;
    aspect-ratio: 4/3;
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .project.hidden {
    display: none;
  }

  .project:nth-child(6n+1) { grid-column: span 4; aspect-ratio: 5/4; }
  .project:nth-child(6n+2) { grid-column: span 2; aspect-ratio: 3/4; }
  .project:nth-child(6n+3) { grid-column: span 2; aspect-ratio: 3/4; }
  .project:nth-child(6n+4) { grid-column: span 4; aspect-ratio: 16/9; }
  .project:nth-child(6n+5) { grid-column: span 3; aspect-ratio: 4/5; }
  .project:nth-child(6n+6) { grid-column: span 3; aspect-ratio: 4/5; }

  .project img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .project:hover img { transform: scale(1.04); }

  .project-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(18px, 3vw, 32px);
    background: linear-gradient(to top, rgba(0,0,0,0.62), transparent 55%);
    color: #fff;
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .project:hover .project-overlay,
  .project:focus-within .project-overlay { opacity: 1; }

  .project-title { font-size: 1.05rem; font-weight: 500; }
  .project-meta { font-size: 0.72rem; opacity: 0.75; margin-top: 4px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 800px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
    .project,
    .project:nth-child(6n+1),
    .project:nth-child(6n+2),
    .project:nth-child(6n+3),
    .project:nth-child(6n+4),
    .project:nth-child(6n+5),
    .project:nth-child(6n+6) {
      grid-column: span 1;
      aspect-ratio: 4/3;
    }
  }

  @media (max-width: 520px) {
    .gallery { grid-template-columns: 1fr; }
    .project,
    .project:nth-child(6n+1),
    .project:nth-child(6n+2),
    .project:nth-child(6n+3),
    .project:nth-child(6n+4),
    .project:nth-child(6n+5),
    .project:nth-child(6n+6) {
      grid-column: span 1;
      aspect-ratio: 4/3;
    }
  }

</style>
</head>
