name: Update Gallery Data

on:
  push:
    paths:
      - 'images/**/*.jpg'
      - 'images/**/*.jpeg'
      - 'images/**/*.JPG'
      - 'images/**/*.JPEG'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-build
  cancel-in-progress: true

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tool
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build Full, Thumbnail and Gallery Data
        shell: python
        run: |
          import json
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path('images')

          # Source workflow:
          #   room/category/photo.jpg
          # becomes:
          #   photo_full.jpg
          #   photo_thumb.jpg
          # Existing _full/_thumb files are kept and never regenerated.
          for source in root.rglob('*'):
              if not source.is_file() or source.suffix.lower() not in {'.jpg', '.jpeg'}:
                  continue
              if source.stem.endswith('_full') or source.stem.endswith('_thumb'):
                  continue

              full = source.with_name(source.stem + '_full.jpg')
              thumb = source.with_name(source.stem + '_thumb.jpg')

              if not full.exists():
                  with Image.open(source) as im:
                      im = ImageOps.exif_transpose(im).convert('RGB')
                      im.save(full, 'JPEG', quality=92, optimize=True)

              if not thumb.exists():
                  with Image.open(source) as im:
                      im = ImageOps.exif_transpose(im).convert('RGB')
                      im.thumbnail((1200, 900), Image.Resampling.LANCZOS)
                      im.save(thumb, 'JPEG', quality=82, optimize=True)

          # Build gallery-data.json for every room / category automatically.
          # Room pages load this file via gallery.js (no HTML injection).
          galleries = {}
          for room in sorted(root.iterdir(), key=lambda p: p.name):
              if not room.is_dir():
                  continue
              galleries[room.name] = {}
              for category in sorted(room.iterdir(), key=lambda p: p.name):
                  if not category.is_dir():
                      continue
                  items = []
                  for full in sorted(category.glob('*_full.jpg')):
                      prefix = full.name[:-9]  # strip _full.jpg
                      thumb = category / (prefix + '_thumb.jpg')
                      if not thumb.exists():
                          continue
                      items.append({
                          'name': prefix,
                          'thumb': str(thumb).replace('\\', '/'),
                          'full': str(full).replace('\\', '/'),
                      })
                  galleries[room.name][category.name] = items

          Path('gallery-data.json').write_text(
              json.dumps(galleries, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print('Wrote gallery-data.json')
          print(json.dumps({k: {c: len(v) for c, v in cats.items()} for k, cats in galleries.items()}, ensure_ascii=False, indent=2))

      - name: Commit generated assets and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add images gallery-data.json

          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Build image assets and gallery data'
            git push
          fi
