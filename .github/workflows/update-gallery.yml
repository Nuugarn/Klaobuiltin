name: Update Gallery Data

on:
  push:
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gallery data and repair Kitchen loader
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("images")
          galleries = {}

          for room in root.iterdir():
              if not room.is_dir():
                  continue
              galleries[room.name] = {}
              for category in room.iterdir():
                  if not category.is_dir():
                      continue
                  items = []
                  for full in sorted(category.glob("*_full.jpg")):
                      prefix = full.name[:-9]
                      thumb = category / f"{prefix}_thumb.jpg"
                      if thumb.exists():
                          items.append({
                              "name": prefix,
                              "thumb": str(thumb).replace("\\", "/"),
                              "full": str(full).replace("\\", "/")
                          })
                  galleries[room.name][category.name] = items

          Path("gallery-data.json").write_text(
              json.dumps(galleries, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          kitchen = Path("kitchen.html")
          html = kitchen.read_text(encoding="utf-8")
          html = html.replace(
              "document.querySelector('.gallery-filter')",
              "document.querySelector('[data-space-filters=\"kitchen\"]')"
          )
          kitchen.write_text(html, encoding="utf-8")

      - name: Commit gallery data and Kitchen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json kitchen.html
          if git diff --cached --quiet; then
            echo "No gallery or Kitchen changes"
          else
            git commit -m "Fix automatic Kitchen gallery loader"
            git push
          fi
