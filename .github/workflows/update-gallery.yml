name: Update Gallery Data

on:
  push:
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gallery data and Kitchen gallery
        shell: python
        run: |
          import html
          import json
          from pathlib import Path

          root = Path("images")
          galleries = {}

          for room in root.iterdir():
              if not room.is_dir():
                  continue

              galleries[room.name] = {}

              for category in sorted(room.iterdir(), key=lambda p: p.name):
                  if not category.is_dir():
                      continue

                  items = []
                  for full in sorted(category.glob("*_full.jpg")):
                      prefix = full.name[:-9]
                      thumb = category / f"{prefix}_thumb.jpg"
                      if thumb.exists():
                          items.append({
                              "name": prefix,
                              "thumb": str(thumb).replace("\\", "/"),
                              "full": str(full).replace("\\", "/")
                          })

                  galleries[room.name][category.name] = items

          Path("gallery-data.json").write_text(
              json.dumps(galleries, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          # Build Kitchen's gallery directly into kitchen.html.
          # The browser's existing filter and lightbox code can then work
          # without a manifest or a client-side GitHub API request.
          kitchen_data = galleries.get("kitchen", {})
          labels = {
              "base": "ตู้ล่าง",
              "wall": "ตู้ลอย",
              "sink": "ตู้ซิงค์",
              "island": "เคาน์เตอร์เกาะกลาง"
          }

          cards = []
          for category in ["base", "wall", "sink", "island"]:
              for item in kitchen_data.get(category, []):
                  label = labels.get(category, category)
                  name = html.escape(item["name"])
                  thumb = html.escape(item["thumb"], quote=True)
                  full = html.escape(item["full"], quote=True)
                  cards.append(
                      f'''      <div class="project" data-cat="{category}">
        <img src="{thumb}" data-full="{full}" alt="{label} — {name}">
        <div class="project-overlay">
          <div class="project-meta">{label}</div>
        </div>
      </div>'''
                  )

          kitchen = Path("kitchen.html")
          text = kitchen.read_text(encoding="utf-8")

          start = text.find('<div class="gallery space-gallery"')
          if start == -1:
              raise SystemExit("Kitchen gallery container not found")

          section_end = text.find('</section>', start)
          if section_end == -1:
              raise SystemExit("Kitchen gallery section not found")

          gallery_close = text.rfind('</div>', start, section_end)
          if gallery_close == -1:
              raise SystemExit("Kitchen gallery closing tag not found")

          open_end = text.find('>', start)
          if open_end == -1 or open_end > gallery_close:
              raise SystemExit("Kitchen gallery opening tag is invalid")

          new_gallery = (
              text[start:open_end + 1]
              + ('\n' + '\n'.join(cards) if cards else '')
              + '\n    </div>'
          )

          text = text[:start] + new_gallery + text[gallery_close + len('</div>'):]
          kitchen.write_text(text, encoding="utf-8")

      - name: Commit gallery data and Kitchen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json kitchen.html
          if git diff --cached --quiet; then
            echo "No gallery or Kitchen changes"
          else
            git commit -m "Build Kitchen gallery from image folders"
            git push
          fi
