name: Update Gallery Data

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tool
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build thumbnails and gallery data
        shell: python
        run: |
          import html, json
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path('images')
          galleries = {}

          # If a *_full.jpg has no matching *_thumb.jpg, create it automatically.
          # Existing thumbnails are never overwritten.
          for full in root.rglob('*_full.jpg'):
              thumb = full.with_name(full.name[:-9] + '_thumb.jpg')
              if not thumb.exists():
                  with Image.open(full) as im:
                      im = ImageOps.exif_transpose(im).convert('RGB')
                      im.thumbnail((1200, 900), Image.Resampling.LANCZOS)
                      im.save(thumb, 'JPEG', quality=82, optimize=True)

          for room in root.iterdir():
              if not room.is_dir():
                  continue
              galleries[room.name] = {}
              for category in sorted(room.iterdir(), key=lambda p: p.name):
                  if not category.is_dir():
                      continue
                  items = []
                  for full in sorted(category.glob('*_full.jpg')):
                      prefix = full.name[:-9]
                      thumb = category / f'{prefix}_thumb.jpg'
                      if thumb.exists():
                          items.append({
                              'name': prefix,
                              'thumb': str(thumb).replace('\\', '/'),
                              'full': str(full).replace('\\', '/')
                          })
                  galleries[room.name][category.name] = items

          Path('gallery-data.json').write_text(
              json.dumps(galleries, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )

          labels = {
              'base': 'ตู้ล่าง',
              'wall': 'ตู้ลอย',
              'sink': 'ตู้ซิงค์',
              'island': 'เคาน์เตอร์เกาะกลาง'
          }

          cards = []
          for category in ['base', 'wall', 'sink', 'island']:
              for item in galleries.get('kitchen', {}).get(category, []):
                  label = labels.get(category, category)
                  cards.append(
                      f'''      <div class="project" data-cat="{html.escape(category, quote=True)}">\n'''
                      f'''        <img src="{html.escape(item['thumb'], quote=True)}" data-full="{html.escape(item['full'], quote=True)}" alt="{html.escape(label + ' — ' + item['name'], quote=True)}">\n'''
                      f'''        <div class="project-overlay">\n'''
                      f'''          <div class="project-meta">{html.escape(label)}</div>\n'''
                      f'''        </div>\n'''
                      f'''      </div>'''
                  )

          kitchen = Path('kitchen.html')
          text = kitchen.read_text(encoding='utf-8')
          start_marker = '<!-- GALLERY_AUTO_START -->'
          end_marker = '<!-- GALLERY_AUTO_END -->'

          if start_marker not in text or end_marker not in text:
              raise SystemExit('Kitchen gallery markers not found')

          a = text.index(start_marker) + len(start_marker)
          b = text.index(end_marker, a)
          text = text[:a] + '\n' + '\n'.join(cards) + '\n    ' + text[b:]
          kitchen.write_text(text, encoding='utf-8')

      - name: Commit gallery data and Kitchen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images gallery-data.json kitchen.html
          if git diff --cached --quiet; then
            echo 'No gallery or Kitchen changes'
          else
            git commit -m 'Build Kitchen gallery from image folders'
            git push
          fi
